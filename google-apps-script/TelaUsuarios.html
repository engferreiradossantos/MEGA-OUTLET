<!DOCTYPE html>
<!--
  MEGA OUTLET — Gestão de Usuários (exclusiva do perfil Administrador).
  Cadastro de novos usuários, redefinição de senha e ativação/desativação —
  tudo pelo sistema, sem editar a aba Usuarios manualmente.

  No editor do Apps Script este arquivo deve se chamar "TelaUsuarios"
  (não "Usuarios"): o Apps Script exige nomes únicos entre TODOS os
  arquivos do projeto, e "Usuarios" já é usado pelo script Usuarios.gs.
-->
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 14px;
           margin: 0; padding: 16px; color: #222; }
    h3 { margin: 4px 0 8px; border-bottom: 2px solid #1a73e8;
         padding-bottom: 4px; color: #1a73e8; }
    label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
    input, select, button { width: 100%; padding: 7px; margin-top: 2px;
      border: 1px solid #bbb; border-radius: 4px; font-size: 14px; }
    button { cursor: pointer; border: none; font-weight: bold; }
    .botao-azul { background: #1a73e8; color: #fff; margin-top: 12px; }
    .botao-verde { background: #188038; color: #fff; margin-top: 12px; }
    .caixa-login { max-width: 340px; margin: 24px auto; border: 1px solid #ccc;
                   border-radius: 8px; padding: 20px; background: #fafbff; }
    .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; font-size: 13px;
             text-align: left; }
    th { background: #f0f0f0; }
    .mensagem { padding: 10px; border-radius: 4px; margin-top: 12px;
                display: none; white-space: pre-wrap; }
    .mensagem.sucesso { display: block; background: #e6f4ea; color: #188038; }
    .mensagem.erro { display: block; background: #fce8e6; color: #c5221f; }
    .aviso { font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <!-- Login (apenas Administrador) -->
  <div id="tela-login" class="caixa-login">
    <h3>🔐 Login do Administrador</h3>
    <label>Login</label>
    <input id="login-usuario" onkeydown="if(event.key==='Enter')entrar()">
    <label>Senha</label>
    <input id="login-senha" type="password"
           onkeydown="if(event.key==='Enter')entrar()">
    <button class="botao-azul" onclick="entrar()">Entrar</button>
  </div>

  <!-- Gestão (após o login) -->
  <div id="tela-gestao" style="display:none">
    <h3>👥 Usuários cadastrados</h3>
    <div id="tabela-usuarios"></div>

    <div class="grade" style="margin-top:16px">
      <section>
        <h3>➕ Cadastrar usuário</h3>
        <label>Nome completo</label><input id="novo-nome">
        <label>Login</label><input id="novo-login">
        <label>Perfil</label>
        <select id="novo-perfil">
          <option>Vendedor</option>
          <option>Administrador</option>
        </select>
        <label>Senha (mín. 6 caracteres)</label>
        <input id="nova-senha" type="password">
        <button class="botao-verde" onclick="cadastrar()">💾 Cadastrar</button>
      </section>

      <section>
        <h3>🔧 Gerenciar usuário</h3>
        <label>Usuário</label>
        <select id="usuario-selecionado"></select>
        <label>Nova senha (para redefinir)</label>
        <input id="senha-redefinir" type="password">
        <button class="botao-azul" onclick="redefinirSenha()">
          🔑 Redefinir senha
        </button>
        <button class="botao-verde" id="botao-ativo" onclick="alternarAtivo()">
          🚦 Ativar/Desativar
        </button>
      </section>
    </div>
  </div>

  <div id="mensagem" class="mensagem"></div>

<script>
  var tokenSessao = null;
  var usuarios = []; // última lista carregada do servidor

  function entrar() {
    google.script.run
      .withSuccessHandler(function (sessao) {
        if (sessao.perfil !== 'Administrador') {
          mostrar('erro', '⚠️ Acesso restrito ao perfil Administrador. ' +
                          'Seu perfil é ' + sessao.perfil + '.');
          return;
        }
        tokenSessao = sessao.token;
        document.getElementById('tela-login').style.display = 'none';
        document.getElementById('tela-gestao').style.display = 'block';
        mostrar('', '');
        carregarUsuarios();
      })
      .withFailureHandler(falha)
      .loginUsuario(document.getElementById('login-usuario').value,
                    document.getElementById('login-senha').value);
  }

  function carregarUsuarios() {
    google.script.run
      .withSuccessHandler(function (lista) {
        usuarios = lista;
        desenharTabela();
        desenharSelect();
      })
      .withFailureHandler(falha)
      .listarUsuarios(tokenSessao);
  }

  function desenharTabela() {
    var html = '<table><tr><th>ID</th><th>Login</th><th>Nome</th>' +
               '<th>Perfil</th><th>Situação</th></tr>';
    usuarios.forEach(function (u) {
      html += '<tr><td>' + u.idUsuario + '</td><td>' + escapar(u.login) +
              '</td><td>' + escapar(u.nome) + '</td><td>' + escapar(u.perfil) +
              '</td><td>' + (u.ativo ? '✅ Ativo' : '🚫 Desativado') +
              '</td></tr>';
    });
    document.getElementById('tabela-usuarios').innerHTML = html + '</table>';
  }

  function desenharSelect() {
    var select = document.getElementById('usuario-selecionado');
    select.innerHTML = '';
    usuarios.forEach(function (u) {
      var opcao = document.createElement('option');
      opcao.value = u.idUsuario;
      opcao.textContent = u.nome + ' (' + u.login + ') — ' + u.perfil +
                          (u.ativo ? '' : ' [desativado]');
      select.appendChild(opcao);
    });
  }

  function cadastrar() {
    google.script.run
      .withSuccessHandler(function (resultado) {
        mostrar('sucesso', 'Usuário cadastrado com ID ' + resultado.idUsuario + '.');
        ['novo-nome', 'novo-login', 'nova-senha'].forEach(function (id) {
          document.getElementById(id).value = '';
        });
        carregarUsuarios();
      })
      .withFailureHandler(falha)
      .criarUsuario(tokenSessao, {
        nome: document.getElementById('novo-nome').value,
        login: document.getElementById('novo-login').value,
        perfil: document.getElementById('novo-perfil').value,
        senha: document.getElementById('nova-senha').value,
      });
  }

  function redefinirSenha() {
    google.script.run
      .withSuccessHandler(function () {
        mostrar('sucesso', 'Senha redefinida.');
        document.getElementById('senha-redefinir').value = '';
      })
      .withFailureHandler(falha)
      .definirSenha(tokenSessao,
                    document.getElementById('usuario-selecionado').value,
                    document.getElementById('senha-redefinir').value);
  }

  function alternarAtivo() {
    var id = Number(document.getElementById('usuario-selecionado').value);
    var usuario = usuarios.filter(function (u) {
      return u.idUsuario === id;
    })[0];
    if (!usuario) return;
    google.script.run
      .withSuccessHandler(function () {
        mostrar('sucesso', usuario.ativo
          ? 'Usuário desativado.' : 'Usuário reativado.');
        carregarUsuarios();
      })
      .withFailureHandler(falha)
      .definirAtivo(tokenSessao, id, !usuario.ativo);
  }

  function falha(erro) { mostrar('erro', '⚠️ ' + (erro.message || erro)); }

  function mostrar(classe, texto) {
    var div = document.getElementById('mensagem');
    div.className = classe ? 'mensagem ' + classe : 'mensagem';
    div.textContent = texto;
  }

  function escapar(texto) {
    var span = document.createElement('span');
    span.textContent = String(texto == null ? '' : texto);
    return span.innerHTML;
  }
</script>
</body>
</html>
