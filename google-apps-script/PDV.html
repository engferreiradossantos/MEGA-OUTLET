<!DOCTYPE html>
<!--
  MEGA OUTLET — Tela de PDV / Frente de Caixa (requisito 4).

  Fluxo: buscar produto → montar carrinho → dados do cliente e entrega →
  "Finalizar Venda" chama registrarVenda (Vendas.gs), que faz a baixa no
  estoque e o lançamento no caixa simultaneamente → recibo para impressão.
-->
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 14px;
           margin: 0; padding: 12px; color: #222; }
    h3 { margin: 4px 0 8px; border-bottom: 2px solid #1a73e8;
         padding-bottom: 4px; color: #1a73e8; }
    label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
    input, select, textarea, button {
      width: 100%; padding: 7px; margin-top: 2px;
      border: 1px solid #bbb; border-radius: 4px; font-size: 14px;
    }
    textarea { resize: vertical; }
    button { cursor: pointer; border: none; }
    .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .linha { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .botao-azul { background: #1a73e8; color: #fff; font-weight: bold; }
    .botao-verde { background: #188038; color: #fff; font-weight: bold;
                   padding: 12px; font-size: 16px; margin-top: 14px; }
    .botao-cinza { background: #eee; color: #222; }
    .item-carrinho { display: flex; justify-content: space-between;
                     align-items: center; padding: 6px 8px; margin-top: 4px;
                     background: #f5f8ff; border-radius: 4px; }
    .item-carrinho button { width: auto; background: none; color: #c00;
                            font-size: 16px; padding: 0 6px; }
    .total { text-align: right; font-size: 18px; font-weight: bold;
             margin-top: 10px; }
    .mensagem { padding: 10px; border-radius: 4px; margin-top: 12px;
                display: none; white-space: pre-wrap; }
    .mensagem.sucesso { display: block; background: #e6f4ea; color: #188038; }
    .mensagem.erro { display: block; background: #fce8e6; color: #c5221f; }
    .aviso { font-size: 12px; color: #777; margin-top: 4px; }
    #secao-recibo { margin-top: 14px; display: none; }
    #frame-recibo { width: 100%; height: 320px; border: 1px solid #ccc;
                    border-radius: 4px; background: #fff; }
    #resultado-busca:disabled { background: #f5f5f5; }
  </style>
</head>
<body>
  <div class="grade">
    <!-- Coluna 1: busca de produto (por código ou nome) -->
    <section>
      <h3>1. Buscar produto</h3>
      <label>Código (SKU) ou parte da descrição</label>
      <input id="termo-busca" placeholder="Ex.: SOF-001 ou sofá"
             onkeydown="if(event.key==='Enter')buscar()">
      <button class="botao-azul" style="margin-top:8px" onclick="buscar()">
        🔍 Buscar
      </button>

      <label>Resultado</label>
      <select id="resultado-busca" disabled onchange="preencherPreco()"></select>

      <div class="linha2">
        <div>
          <label>Quantidade</label>
          <input id="quantidade" type="number" min="1" step="1" value="1">
        </div>
        <div>
          <label>Preço unitário (R$) — ajuste p/ desconto</label>
          <input id="preco" type="number" min="0" step="0.01">
        </div>
      </div>
      <button class="botao-cinza" style="margin-top:8px"
              onclick="adicionarAoCarrinho()">➕ Adicionar ao carrinho</button>
    </section>

    <!-- Coluna 2: carrinho -->
    <section>
      <h3>2. Carrinho</h3>
      <div id="carrinho"><div class="aviso">Carrinho vazio.</div></div>
      <div class="total" id="total"></div>
    </section>
  </div>

  <!-- Dados do cliente, entrega, pagamento e finalização -->
  <section>
    <h3>3. Dados do cliente e finalização</h3>
    <div class="linha">
      <div><label>Nome do cliente *</label><input id="cliente-nome"></div>
      <div><label>CPF</label><input id="cliente-cpf"></div>
      <div><label>Telefone</label><input id="cliente-telefone"></div>
    </div>
    <div class="linha">
      <div>
        <label>Forma de entrega</label>
        <select id="forma-entrega" onchange="alternarEndereco()"></select>
      </div>
      <div>
        <label>Forma de pagamento</label>
        <select id="forma-pagamento"></select>
      </div>
      <div id="bloco-endereco" style="display:none">
        <label>Endereço de entrega *</label>
        <input id="endereco-entrega">
      </div>
    </div>
    <label>Observações</label>
    <textarea id="observacoes" rows="2"
      placeholder="Aviso legal de peças outlet/mostruário é acrescentado automaticamente."></textarea>
    <label style="display:flex;align-items:center;gap:6px;margin-top:10px">
      <input type="checkbox" id="sob-encomenda" style="width:auto">
      Permitir venda Sob Encomenda (vender mesmo sem saldo em estoque)
    </label>

    <button id="botao-finalizar" class="botao-verde" onclick="finalizarVenda()">
      ✅ Finalizar Venda
    </button>
    <div id="mensagem" class="mensagem"></div>
  </section>

  <!-- Recibo da venda recém-concluída -->
  <section id="secao-recibo">
    <h3>🖨️ Recibo</h3>
    <iframe id="frame-recibo"></iframe>
    <button class="botao-azul" style="margin-top:8px" onclick="imprimirRecibo()">
      🖨️ Imprimir recibo
    </button>
  </section>

<script>
  // Estado da tela
  var carrinho = [];          // itens adicionados: {idProduto, sku, descricao, quantidade, precoUnitario}
  var resultadosBusca = [];   // últimos produtos devolvidos pela busca
  var htmlRecibo = '';        // recibo da última venda concluída

  // Carrega as listas de opções (formas de pagamento/entrega) do servidor
  google.script.run.withSuccessHandler(function (opcoes) {
    preencherSelect('forma-entrega', opcoes.formasEntrega);
    preencherSelect('forma-pagamento', opcoes.formasPagamento);
  }).obterOpcoesFormularios();

  function preencherSelect(id, valores) {
    var select = document.getElementById(id);
    select.innerHTML = '';
    valores.forEach(function (v) {
      var opcao = document.createElement('option');
      opcao.value = v; opcao.textContent = v;
      select.appendChild(opcao);
    });
  }

  function formatarMoeda(valor) {
    var partes = Number(valor).toFixed(2).split('.');
    return 'R$ ' + partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + partes[1];
  }

  // ---------------- Busca de produto ----------------
  function buscar() {
    var termo = document.getElementById('termo-busca').value.trim();
    if (!termo) return;
    var select = document.getElementById('resultado-busca');
    select.disabled = true;
    select.innerHTML = '<option>Buscando…</option>';

    google.script.run
      .withSuccessHandler(function (produtos) {
        resultadosBusca = produtos;
        select.innerHTML = '';
        if (!produtos.length) {
          select.innerHTML = '<option>Nenhum produto encontrado</option>';
          return;
        }
        produtos.forEach(function (p, i) {
          var opcao = document.createElement('option');
          opcao.value = i;
          opcao.textContent = p.sku + ' — ' + p.descricao +
            ' (estoque: ' + p.quantidadeAtual + ' | ' +
            formatarMoeda(p.precoVenda) + ')';
          select.appendChild(opcao);
        });
        select.disabled = false;
        preencherPreco();
      })
      .withFailureHandler(mostrarErro)
      .buscarProdutos(termo);
  }

  // Preenche o campo de preço com o preço de venda do produto selecionado
  function preencherPreco() {
    var indice = document.getElementById('resultado-busca').value;
    var produto = resultadosBusca[indice];
    if (produto) document.getElementById('preco').value = produto.precoVenda;
  }

  // ---------------- Carrinho ----------------
  function adicionarAoCarrinho() {
    var indice = document.getElementById('resultado-busca').value;
    var produto = resultadosBusca[indice];
    if (!produto) { mostrarErro({ message: 'Busque e selecione um produto primeiro.' }); return; }

    var quantidade = parseInt(document.getElementById('quantidade').value, 10);
    var preco = parseFloat(document.getElementById('preco').value);
    if (!quantidade || quantidade < 1) { mostrarErro({ message: 'Quantidade inválida.' }); return; }
    if (isNaN(preco) || preco < 0) { mostrarErro({ message: 'Preço inválido.' }); return; }

    carrinho.push({
      idProduto: produto.idProduto,
      sku: produto.sku,
      descricao: produto.descricao,
      quantidade: quantidade,
      precoUnitario: Math.round(preco * 100) / 100,
    });
    limparMensagem();
    desenharCarrinho();
  }

  function removerDoCarrinho(indice) {
    carrinho.splice(indice, 1);
    desenharCarrinho();
  }

  function desenharCarrinho() {
    var div = document.getElementById('carrinho');
    div.innerHTML = '';
    if (!carrinho.length) {
      div.innerHTML = '<div class="aviso">Carrinho vazio.</div>';
      document.getElementById('total').textContent = '';
      return;
    }
    var total = 0;
    carrinho.forEach(function (item, i) {
      var subtotal = item.quantidade * item.precoUnitario;
      total += subtotal;

      var linha = document.createElement('div');
      linha.className = 'item-carrinho';

      var texto = document.createElement('span');
      texto.textContent = item.sku + ' ' + item.descricao + ' — ' +
        item.quantidade + ' × ' + formatarMoeda(item.precoUnitario) +
        ' = ' + formatarMoeda(subtotal);

      var botao = document.createElement('button');
      botao.textContent = '✖';
      botao.title = 'Remover item';
      botao.onclick = function () { removerDoCarrinho(i); };

      linha.appendChild(texto);
      linha.appendChild(botao);
      div.appendChild(linha);
    });
    document.getElementById('total').textContent = 'Total: ' + formatarMoeda(total);
  }

  // ---------------- Entrega ----------------
  function alternarEndereco() {
    var retira = document.getElementById('forma-entrega').value === 'Retira';
    document.getElementById('bloco-endereco').style.display =
      retira ? 'none' : 'block';
  }

  // ---------------- Finalização ----------------
  function finalizarVenda() {
    limparMensagem();
    if (!carrinho.length) {
      mostrarErro({ message: 'Adicione pelo menos um item ao carrinho.' });
      return;
    }
    var botao = document.getElementById('botao-finalizar');
    botao.disabled = true;
    botao.textContent = '⏳ Registrando venda…';

    google.script.run
      .withSuccessHandler(function (resultado) {
        botao.disabled = false;
        botao.textContent = '✅ Finalizar Venda';

        mostrarSucesso('Venda Nº ' + resultado.idVenda + ' registrada! Total ' +
          formatarMoeda(resultado.valorTotal) +
          ' — estoque baixado e Entrada lançada no caixa.');

        // Limpa o carrinho e exibe o recibo
        carrinho = [];
        desenharCarrinho();
        htmlRecibo = resultado.reciboHtml;
        document.getElementById('secao-recibo').style.display = 'block';
        document.getElementById('frame-recibo').srcdoc = htmlRecibo;
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        botao.textContent = '✅ Finalizar Venda';
        mostrarErro(erro);
      })
      .registrarVenda({
        clienteNome: document.getElementById('cliente-nome').value,
        clienteCpf: document.getElementById('cliente-cpf').value,
        clienteTelefone: document.getElementById('cliente-telefone').value,
        formaEntrega: document.getElementById('forma-entrega').value,
        enderecoEntrega: document.getElementById('endereco-entrega').value,
        formaPagamento: document.getElementById('forma-pagamento').value,
        observacoes: document.getElementById('observacoes').value,
        permitirSobEncomenda: document.getElementById('sob-encomenda').checked,
        itens: carrinho.map(function (item) {
          return {
            idProduto: item.idProduto,
            quantidade: item.quantidade,
            precoUnitario: item.precoUnitario,
          };
        }),
      });
  }

  // Abre o recibo em uma nova janela e dispara a impressão do navegador
  function imprimirRecibo() {
    var janela = window.open('', '_blank');
    janela.document.write('<html><head><title>Recibo — MEGA OUTLET</title></head>' +
                          '<body>' + htmlRecibo + '</body></html>');
    janela.document.close();
    janela.focus();
    janela.print();
  }

  // ---------------- Mensagens ----------------
  function mostrarSucesso(texto) {
    var div = document.getElementById('mensagem');
    div.className = 'mensagem sucesso';
    div.textContent = texto;
  }
  function mostrarErro(erro) {
    var div = document.getElementById('mensagem');
    div.className = 'mensagem erro';
    div.textContent = '⚠️ ' + (erro.message || erro);
  }
  function limparMensagem() {
    document.getElementById('mensagem').className = 'mensagem';
  }
</script>
</body>
</html>
